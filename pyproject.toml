[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vs-template-deps"
description = "Vapoursynth template dependencies"
version = "1.0.0"
license = {text = "GPL-3.0"}
readme = "README.md"

requires-python = ">=3.13"

dependencies = [
  "VapourSynth >= 78",
  "vsjetpack[full,nvidia] >= 2.2.0",
  "vapoursynth-scxvid >= 3.0",
  "vapoursynth-zscene >= 0.5.0",
  "vapoursynth-zsmooth >= 0.20.0",
  "awsmfunc >= 1.3.5",
  "xclean @ git+https://github.com/mysteryx93/xClean.git,
  "vs-maskdetail @ git+https://github.com/MonoS/VS-MaskDetail.git"
]

[project.urls]
Homepage = "https://github.com/MRos7909/vs-template-deps"

[tool.setuptools.package-data]
vs-template-deps = ["py.typed"]

[project.optional-dependencies]
dev = ["toml"]